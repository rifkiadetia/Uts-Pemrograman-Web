<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Tracking Pengiriman | Rifki Bookhouse</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="tracking">
<header class="topbar"><a class="brand" href="dashboard.html">📚 Rifki Bookhouse</a>
<nav aria-label="Navigasi utama"><a href="dashboard.html">Dashboard</a><a href="stok.html">Katalog</a><a href="checkout.html">Pemesanan</a><a href="tracking.html">Tracking</a><button id="logout" class="btn ghost" type="button">Keluar</button></nav></header>
<main>
  <h1>Informasi pengiriman</h1>
  <section class="card">
    <form id="formTrack" novalidate>
      <label for="noDo">Nomor Delivery Order</label>
      <input id="noDo" placeholder="Contoh: DO2026001">
      <p id="errTrack" class="error" role="alert"></p>
      <button class="btn" type="submit">Cari</button>
    </form>
  </section>
  <section class="card" id="hasil" hidden aria-live="polite">
    <h2>Pesanan atas nama <span id="rNama"></span></h2>
    <p>Status: <strong id="rStatus"></strong></p>
    <div class="bar-wrap"><div id="bar"></div></div>
    <ol id="tahap"></ol>
    <dl>
      <dt>Ekspedisi</dt><dd id="rEkspedisi"></dd>
      <dt>Tanggal kirim</dt><dd id="rTanggal"></dd>
      <dt>Jenis paket</dt><dd id="rPaket"></dd>
      <dt>Total pembayaran</dt><dd id="rTotal"></dd>
    </dl>
  </section>
</main>
<footer class="footer"><p>&copy; 2026 Rifki Bookhouse – UTS Pemrograman Web 1</p></footer><script src="js/data.js"></script><script src="js/script.js"></script></body></html>
